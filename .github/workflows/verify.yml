name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the PR version-bump step writes; everything else here reads.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On a PR, check the head branch out by name rather than the detached merge commit,
          # so the bump can amend it and push it back. fetch-depth 0 because amending needs
          # the commit's own history, and the base version is read from origin/main.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Runs BEFORE the tests on purpose. A push made with GITHUB_TOKEN queues a run that never
      # executes - observed on this repo as a `pull_request` run sitting at `action_required`
      # with zero jobs - so the amended head is never tested by a run of its own. Bumping first
      # and pushing last is therefore the only thing that makes the pushed tree the tested tree.
      #
      # Consequence to know: the PR's head commit ends with no completed check (mergeStateStatus
      # UNSTABLE). Harmless while `verify` is not a required status check; if it ever becomes one,
      # push with a PAT or App token instead of GITHUB_TOKEN so the run actually executes.
      - name: Version bump to one patch above main
        id: bump
        # Pull requests only, and only from a branch in this repo - a fork's head is not
        # pushable and GITHUB_TOKEN is read-only there.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          # checkout fetches only the ref it was asked for, so origin/main is not there yet.
          git fetch --no-tags origin main
          BASE=$(git show origin/main:package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          echo "main is at $BASE"
          node .github/scripts/bump-version.js --base "$BASE"

      - name: Syntax check
        run: npm run syntax

      - name: Unit tests
        run: npm test

      - name: git-ops self-test (worktree/branch/commit/pr/reap)
        # Builds its own throwaway repo + bare remote + gh stub and sets a repo-local git
        # identity, so no global git config or real gh is needed here.
        run: bash skills/dw-git-ops-skill/scripts/ops-self-test.sh

      - name: runbook lock self-test (mutex, coalesce, stale-takeover)
        run: node skills/dw-runbook-skill/scripts/lock.js --self-test

      - name: runbook runner self-test (modes, pristine guarantee, cache)
        # The self-test builds its own temp repo and sets a local git identity on it,
        # so no global git config is needed here.
        run: node skills/dw-runbook-skill/scripts/run.js --self-test

      - name: runbook hint-hook self-test
        run: node skills/dw-runbook-skill/scripts/dw-runbook-hint.js --self-test

      - name: env preflight self-test (layout, aws creds shape, root resolution)
        # Builds mkdtemp fixtures (fake nested clone, placeholder-only creds file)
        # and drives the real check functions; needs no Docker daemon and no real
        # credentials.
        run: node skills/dw-env-skill/scripts/env-preflight.js --self-test

      - name: handoff nudge-hook self-test (PreCompact fixtures)
        run: node skills/dw-handoff-skill/scripts/dw-handoff-nudge.js --self-test

      - name: deslop rules-engine self-test (scope, overlay, dry-run)
        run: node skills/dw-deslop-skill/scripts/deslop-rules.js --self-test

      # Vendored copies are generated, so a hand-edit fails the build instead of drifting quietly.
      - name: Vendored utils are in sync
        run: node utils/sync-utils.js --check

      - name: version-bump self-test (patch maths, one-line rewrite, idempotence)
        run: node .github/scripts/bump-version.js --self-test

      # Unconditional, so a hand-edit or a merge that bypassed the PR bump cannot leave the
      # version files disagreeing the way marketplace.json silently did for ten patches.
      - name: Version files agree
        run: node .github/scripts/bump-version.js --check

      - name: Install commands smoke (documented `--` forms, dry-run)
        # Mirrors the documented `npx -y github:owner/repo -- --only ...` commands,
        # plus the legacy `cursor` alias. The leading `--` is the npm/npx separator
        # forwarded to the bin; install.js must tolerate it. Dry-run, no real install.
        run: |
          node bin/install.js -- --dry-run
          node bin/install.js -- --dry-run --only agents
          node bin/install.js -- --dry-run --only claude
          node bin/install.js -- --dry-run --only agents --only claude
          node bin/install.js -- --dry-run --only cursor
          node bin/install.js -- --dry-run --no-hooks

      - name: Packaging smoke
        run: |
          node bin/install.js --list
          node bin/install.js --dry-run --only agents
          node bin/install.js --dry-run --only claude
          for s in dw-flow-skill dw-pr-ready-skill dw-knowledge-skill dw-skill-authoring-skill dw-handoff-skill dw-grilling-skill dw-git-ops-skill dw-deslop-skill dw-team-communication-skill dw-runbook-skill dw-env-skill dw-post-merge-verification-skill; do
            test -f "skills/$s/SKILL.md"
          done

      # Last, so the branch is only rewritten once everything above has passed.
      - name: Amend the version bump onto the PR head
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # xargs rather than an unquoted expansion: the staging list must not depend on the
          # shell's word-splitting rules.
          echo '${{ steps.bump.outputs.files }}' | xargs git add --
          # --amend keeps the original author; only the committer becomes the bot.
          git commit --amend --no-edit
          # The lease is the SHA this run started from, so a push that landed while the job was
          # running aborts this force-push instead of discarding it.
          git push --force-with-lease=refs/heads/${{ github.head_ref }}:${{ github.event.pull_request.head.sha }} \
            origin HEAD:refs/heads/${{ github.head_ref }}
